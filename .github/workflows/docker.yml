name: Imagem Evolution + painel Gestão
on:
  push:
    branches: [gestao-branding-2.3.7]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.evolution
          push: true
          tags: |
            ghcr.io/vschaadt-cyber/evolution-gestao:2.3.7
            ghcr.io/vschaadt-cyber/evolution-gestao:${{ github.sha }}
